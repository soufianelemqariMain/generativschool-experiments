<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 475" role="img" aria-labelledby="panier-courses-scene-title"><title id="panier-courses-scene-title">Faire pousser un premier arbre de prix — démonstration sur entrées fictives</title><g font-family="Plex, sans-serif"><g data-reveal="0"><text x="200" y="28" font-size="18" text-anchor="middle" fill="#172032">Une variation passée de 4 %</text><path class="ink-path" d="M200 42 V86" fill="none" stroke="#172032" stroke-width="2"/><circle cx="200" cy="48" r="6" fill="#bc563f" stroke="#172032"/></g><g data-reveal="1"><text x="200" y="113" font-size="19" text-anchor="middle" fill="#172032">Variation ≤ 3 % ?</text><text x="200" y="139" font-size="14" text-anchor="middle" fill="#172032">Seuil choisi sur les six exemples</text><path class="ink-path" d="M200 155 C200 185 90 185 90 222" fill="none" stroke="#172032" stroke-width="2"/><path class="ink-path" d="M200 155 C200 185 310 185 310 222" fill="none" stroke="#bc563f" stroke-width="2"/><text x="65" y="201" font-size="16" text-anchor="start" fill="#172032">Oui</text><text x="316" y="201" font-size="16" text-anchor="start" fill="#bc563f">Non</text></g><g data-reveal="2"><rect x="35" y="230" width="110" height="68" rx="2" fill="#eee8f6" stroke="#172032"/><rect x="255" y="230" width="110" height="68" rx="2" fill="#e4ebfc" stroke="#172032"/><text x="90" y="259" font-size="24" text-anchor="middle" fill="#172032">1 %</text><text x="310" y="259" font-size="24" text-anchor="middle" fill="#172032">5 %</text><text x="90" y="284" font-size="14" text-anchor="middle" fill="#172032">Feuille</text><text x="310" y="284" font-size="14" text-anchor="middle" fill="#172032">Feuille suivie</text><path class="ink-path" d="M310 305 V336 H200 V356" fill="none" stroke="#bc563f" stroke-width="2"/><text x="200" y="385" font-size="24" text-anchor="middle" fill="#172032">Le panier → 103,4 €</text><text x="200" y="418" font-size="16" text-anchor="middle" fill="#172032">60 € de frais × 1,05</text><text x="200" y="442" font-size="16" text-anchor="middle" fill="#172032">+ 40 € d’autres achats × 1,01</text></g></g></svg>